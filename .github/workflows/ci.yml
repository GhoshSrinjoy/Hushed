name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install hushed from source
        run: python -m pip install .
      - name: Run the tests
        run: python -m unittest discover -s tests -v
