[package]
name = "hushed"
version = "0.3.0"
edition = "2021"
publish = false
description = "Run a Python script unchanged and see what actually happened, including the errors it swallowed"
license = "MIT"
repository = "https://github.com/GhoshSrinjoy/Logger"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# abi3: one compiled module works on Python 3.12 and every later version
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = "fat"
codegen-units = 1
